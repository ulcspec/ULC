version: 2

project_name: ulc

before:
  # Stage the repo-root LICENSE and the unit-conversion policy next to the
  # validator so goreleaser's archive step can bundle them with simple
  # relative paths. The copies are gitignored; the canonical files stay at
  # the repo root and under docs/.
  hooks:
    - go mod tidy
    - cp ../../LICENSE LICENSE
    - cp ../../docs/conversion-policy.md CONVERSION-POLICY.md

builds:
  - id: ulc
    main: ./cmd/ulc
    binary: ulc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.CLIVersion={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: ulc
    name_template: "ulc_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # The `ulc` binary ships with the ULC schemas embedded via go:embed.
    # The archive carries the binary, the validator README, the MIT
    # LICENSE text so binary distributions include the required attribution,
    # and the unit-conversion policy the converter implements.
    files:
      - src: README.md
        dst: README.md
      - src: LICENSE
        dst: LICENSE
      - src: CONVERSION-POLICY.md
        dst: CONVERSION-POLICY.md

checksum:
  name_template: "ulc_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ .Version }}-next"

# Release-note body is composed in `.github/workflows/release.yml` and applied
# via `gh release edit` after goreleaser publishes. We disable goreleaser's
# auto-changelog so its body output is empty until the workflow overrides it.
changelog:
  disable: true

release:
  github:
    owner: ulcspec
    name: ULC
  draft: false
  prerelease: auto
  name_template: "ULC {{ .Tag }}"
