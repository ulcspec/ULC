name: Validator CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: go test + goreleaser check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        run: |
          mkdir -p bin
          go build -o bin/ulc ./tools/validator/cmd/ulc

      - name: Validate example records end-to-end
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          records=(examples/**/*.ulc)
          if [ "${#records[@]}" -eq 0 ]; then
            echo "No example ULC records found; skipping validation."
            exit 0
          fi
          for f in "${records[@]}"; do
            echo "Validating $f"
            ./bin/ulc validate "$f"
          done
        shell: bash

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
          workdir: tools/validator
