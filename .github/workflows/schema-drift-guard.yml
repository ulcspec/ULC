name: Schema drift guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Resolve every $ref across schema files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Schema $ref drift guard
        run: python3 tools/schema-drift-guard.py

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Build ulc CLI
        run: |
          mkdir -p bin
          go build -o bin/ulc ./tools/validator/cmd/ulc

      - name: Verify generated index on example records
        run: |
          shopt -s globstar nullglob
          records=(examples/**/*.ulc examples/**/*.ulc.json)
          if [ "${#records[@]}" -eq 0 ]; then
            echo "No example ULC records found; skipping index parity check."
            exit 0
          fi
          fail=0
          for f in "${records[@]}"; do
            echo "Checking $f"
            if ! ./bin/ulc build-index --check "$f"; then
              fail=1
            fi
          done
          exit $fail
        shell: bash
